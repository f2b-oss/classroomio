# Build check: upstream's tests and build, and the three images, without
# publishing anything. See FORK.md. Also dispatched by fork-sync.yml on sync/*
# branches (see fork-guardrails.yml for why).
#
# Pushes to wip/** and review/** run it too, so a patch can be built and tested
# in a private copy of this repository before a pull request is opened. Nothing
# here needs pull request context, secrets or more than read access.
name: Fork build

on:
  pull_request:
    branches: [f2b]
  push:
    branches: ['wip/**', 'review/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          # pnpm is enabled by corepack in the next step, so setup-node cannot cache it yet.
          package-manager-cache: false
      - name: Enable pnpm (version from package.json packageManager)
        run: npm install --global corepack@latest && corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test utils
        run: pnpm --filter @cio/utils^... build && pnpm --filter @cio/utils build && pnpm --filter @cio/utils test
      - name: Dashboard tests
        run: cp apps/dashboard/.env.example apps/dashboard/.env && pnpm --filter @cio/dashboard test
      - name: Build dashboard
        run: pnpm --filter @cio/dashboard^... build && pnpm --filter @cio/dashboard build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
      - name: Build API
        run: pnpm --filter @cio/api^... build && pnpm --filter @cio/api build
      - name: API tests
        run: pnpm --filter @cio/api exec vitest run
      - name: Jobs tests
        run: pnpm --filter @cio/jobs-worker test

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [api, dashboard, jobs]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.component }} (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: false
          load: true
          tags: fork-build/${{ matrix.component }}:check
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
      - name: Runs as a non-root user
        run: |
          uid="$(docker run --rm --network none --entrypoint id fork-build/${{ matrix.component }}:check -u)"
          echo "uid $uid"
          test "$uid" != 0
      - name: pnpm works offline for the runtime user
        if: matrix.component == 'api'
        run: docker run --rm --network none --entrypoint pnpm fork-build/api:check --version
      - name: api runs database setup and serves as the runtime user
        if: matrix.component == 'api'
        run: docker/api/check-startup.sh fork-build/api:check
      # Negative control: the same image with corepack's prepared pnpm out of
      # reach (it cannot download one: COREPACK_ENABLE_NETWORK=0 and no route
      # out) must fail the startup check, or the check proves nothing.
      - name: startup check fails on an api image without its pnpm
        if: matrix.component == 'api'
        run: |
          cid="$(docker create fork-build/api:check)"
          docker commit --change 'ENV COREPACK_HOME=/tmp/corepack-empty' "$cid" fork-build/api:broken >/dev/null
          docker rm "$cid" >/dev/null
          if docker/api/check-startup.sh fork-build/api:broken 60; then
            echo "FAIL check-startup.sh passed on an image that cannot run pnpm"
            exit 1
          fi
          echo "ok   check-startup.sh rejected the broken image"
      - name: FFmpeg build and media steps
        if: matrix.component == 'jobs'
        run: docker/jobs/check-image.sh fork-build/jobs:check
